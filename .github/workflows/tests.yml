name: CPU tests and source packaging

on: [push, pull_request]

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            torch-version: "2.0.0"
          - python-version: "3.9"
            torch-version: "2.1.2"
          - python-version: "3.10"
            torch-version: "2.6.0"
          - python-version: "3.11"
            torch-version: "2.11.0"
          - python-version: "3.12"
            torch-version: "2.11.0"
    env:
      BUILD_NO_CUDA: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=77" wheel ninja pytest
          python -m pip install "torch==${{ matrix.torch-version }}" --index-url https://download.pytorch.org/whl/cpu
      - name: Install Python package without CUDA kernels
        run: python -m pip install -e ".[dev]" --no-build-isolation
      - name: Test CPU formulas and API validation
        run: python -m pytest -q
      - name: Build source distribution
        run: python setup.py sdist
      - name: Check source archive builds a wheel
        run: python -m pip wheel dist/*.tar.gz --no-deps --no-build-isolation --wheel-dir /tmp/wheels
