# Playground Newton debug profile with damping stabilization.
#
# Usage:
#   python -m scripts.train --config-name playground_newton_train_ema_grad_hess

defaults:
  - base
  - model: playground_simple_shapes
  - trainer: playground_debug_50
  - optim: default
  - schedule: r2gaussian_exp
  - exp: playground_simple_shapes_cone
  - init: playground_file
  - compensate: none
  - strategy: playground
  - vis: playground_debug_every_step
  - _self_

trainer:
  max_steps: 5000
  batch_size: 3
  eval_interval: 100

# Start densification earlier: second-order converges faster, so 200 is enough.
strategy:
  refine_start_iter: 200
  refine_stop_iter: 2500

optim:
  # Newton diagonal-clamp with EMA only on grad/hess signals.
  # This avoids any post-delta update normalization (EMA/AdamNorm on update).
  use_second_order: true
  second_order_optimizer: "newton_diag_clamp"
  verbose: true

  # Signal processing for Newton inputs only.
  grad_strategy: "EMA"
  hess_strategy: "EMA"
  # EMA coefficients for grad/hess signal smoothing.
  # With warmup_beta enabled below, beta is scheduled over time.
  beta1_g: 0.9
  beta1_h: 0.9
  # Warmup beta (cosine): smoothly increase beta from 0.0 -> 0.9.
  warmup_beta_enabled: true
  warmup_beta_schedule: "COSINE"
  warmup_beta_steps: 50
  warmup_beta1_g_start: 0.0
  warmup_beta1_g_end: 0.9
  warmup_beta1_h_start: 0.0
  warmup_beta1_h_end: 0.95
  warmup_beta_bias_correction: false
  warmup_beta_verbose: true
  # Restart beta warmup after topology changes (split/duplicate/prune/compensate)
  # and reset EMA moments to 0.0 so new/migrated Gaussians don't inherit stale
  # pre-topology-change moments (which previously blew up hess_proc).
  topology_reanneal_enabled: true
  topology_reanneal_steps: 50
  topology_reanneal_reset_moments: true
  hess_mode: "DIAGONAL"

  # Lower per-group lr to reduce pure step-size advantage and better expose
  # second-order preconditioning effects.
  lr_means: 0.5
  lr_quats: 0.5
  lr_scale_ori: 0.5
  lr_opacity: 0.5

  # Damping per group, roughly aligned with the median |h_ii| of each group
  # observed in earlier runs. These are the starting (peak) damping values
  # used before the schedule decay; the effective damping further scales by
  # the topology-reanneal multiplier right after split/duplicate/prune.
  # Slightly increase damping on groups that still show hard clipping
  # (especially opacity, and mid-stage means/quats/scale_ori).
  damping_means: 5.0e-2
  damping_quats: 1.5e-3
  damping_scale_ori: 1.5e-4
  damping_opacity: 5.0e-2

  # Hessian diagonal clamp is now a safety floor only; damping is the main
  # Tikhonov-style regularizer.
  clamp_means: 1.0e-7
  clamp_quats: 1.0e-6
  clamp_scale_ori: 1.0e-6
  clamp_opacity: 1.0e-6

  # Adaptive max_update schedule anchor (initial values):
  # set to 10x of first-order Adam lrs, then decay exponentially to 1x.
  # first-order lrs are:
  # means=2e-4, quats=1e-3, scale_ori=5e-3, opacity=1e-4.
  max_update_means: 0.002
  max_update_quats: 0.01
  max_update_scale_ori: 0.05
  max_update_opacity: 0.001

  # Topology-triggered damping reanneal: right after a split/duplicate/prune,
  # multiply damping by `factor` (e.g. 100x), then decay back to 1x over
  # `steps` optimizer steps. This tames Newton steps when EMA moments are
  # being rebuilt and the Hessian is noisiest.
  topology_damping_reanneal_enabled: true
  topology_damping_reanneal_factor: 100.0
  topology_damping_reanneal_steps: 50
  topology_damping_reanneal_schedule: "COSINE"
  topology_damping_reanneal_verbose: true

  allow_negative_opacity: false

# Schedules: lr is fixed at current value; damping uses a whole-cycle
# log-cosine curve (high -> low -> high in linear domain) with min at
# mid-training to improve early/late stability while keeping mid-stage
# second-order sensitivity. max_update decays from 10x -> 1x (exp).
schedule:
  enabled: true
  lr:
    type: "constant"
    warmup_steps: 0
    min_factor: 1.0
  damping:
    type: "log_cosine"
    warmup_steps: 0
    min_factor: 3.0e-2
  max_update:
    type: "exp"
    warmup_steps: 0
    min_factor: 1.0e-1
