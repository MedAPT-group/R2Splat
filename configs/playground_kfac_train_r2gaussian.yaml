# Toy playground profile: K-FAC (empirical Fisher) with damping on the same
# scale as the Fisher estimate.  ``|delta|`` from the rank-1 EF solve is often
# large, so ``update_raw = lr * delta`` is capped by ``max_update_*``.
#
# Here ``max_update_*`` is ~10× the old playground caps (wider trust corridor),
# while ``lr_*`` is much **smaller** than ``playground_adam_train_r2gaussian`` so
# typical ``|lr * delta|`` sits near Adam-scale updates (~2e-4 … 5e-3) instead
# of hugging the clip at every step.
#
# Principle:
#   - ``damping_mode: relative`` with **small** ``damping_*`` (numeric floor only)
#     and moderate ``damping_rel_*`` so
#     ``lambda ~ damping_rel * trace(F)/d + damping_abs`` tracks curvature
#     instead of swamping it.
#   - During ``min_step_for_fisher``, ``warmup_match_fisher_scale: true`` uses
#     the same law with ``trace(F)/d`` replaced by ``||g||^2/d`` (per group),
#     so warmup damping is not a huge fixed floor that makes K-FAC a plain
#     scaled gradient step.
#   - If ``verbose`` shows ``update_clip_hits`` still near 100%, lower ``lr_*``
#     further; if almost never clipping, ``lr_*`` can be raised slightly.
#
# Usage:
#   python -m scripts.train --config-name playground_kfac_train_r2gaussian

defaults:
  - base
  - model: playground_simple_shapes
  - trainer: playground_debug_50
  - optim: kfac
  - schedule: kfac
  - exp: playground_simple_shapes_cone
  - init: playground_file
  - compensate: none
  - strategy: playground
  - vis: playground_debug_every_step
  - _self_

trainer:
  max_steps: 10000
  batch_size: 1
  eval_interval: 100

optim:
  kfac_mode: "per_param_group"

  # Much smaller than Adam playground: per-group ``delta`` spans orders of
  # magnitude (scale/opacity often ≫ means), so each ``lr_*`` is set so typical
  # ``|lr * delta|`` is ~Adam-scale (~2e-4 … 5e-3) under the widened ``max_update``.
  lr_means: 1.0e-8
  lr_quats: 2.0e-6
  lr_scale_ori: 5.0e-9
  lr_opacity: 5.0e-10

  damping_mode: "relative"
  # Tiny absolute floor so the relative term dominates once F has mass.
  damping_means: 1.0e-12
  damping_quats: 1.0e-12
  damping_scale_ori: 1.0e-12
  damping_opacity: 1.0e-12
  damping_rel_means: 0.1
  damping_rel_quats: 0.1
  damping_rel_scale_ori: 0.1
  damping_rel_opacity: 0.1

  min_step_for_fisher: 30
  warmup_match_fisher_scale: true
  # Optional hard clamp on per-row lambda in warmup; 0 = no clamp (only 1e-30
  # guard inside ``||g||^2/d``).
  warmup_damping_floor: 0.0

  ema_decay_means: 0.95
  ema_decay_quats: 0.95
  ema_decay_scale_ori: 0.95
  ema_decay_opacity: 0.95

  grad_ema_decay_means: 0.9
  grad_ema_decay_quats: 0.9
  grad_ema_decay_scale_ori: 0.9
  grad_ema_decay_opacity: 0.9

  eig_clip_means: 1.0e-12
  eig_clip_quats: 1.0e-12
  eig_clip_scale_ori: 1.0e-12
  eig_clip_opacity: 1.0e-12

  # ~10× previous caps: fewer coordinates pinned at ±clip (less pure SIGNUM).
  max_update_means: 8.0e-3
  max_update_quats: 5.0e-2
  max_update_scale_ori: 2.5e-1
  max_update_opacity: 2.0e-2

  bias_correction: true

  topology_damping_reanneal_enabled: true
  topology_damping_reanneal_factor: 8.0
  topology_damping_reanneal_steps: 15
  topology_damping_reanneal_schedule: "COSINE"
  topology_damping_reanneal_verbose: false

  allow_negative_opacity: false

  verbose: true

schedule:
  enabled: true
  lr:
    type: "constant"
    warmup_steps: 0
    min_factor: 1.0
  damping:
    type: "constant"
    warmup_steps: 0
    min_factor: 1.0
  ema_decay:
    type: "exp"
    warmup_steps: 0
    min_factor: 0.2
  eig_clip:
    type: "constant"
    warmup_steps: 0
    min_factor: 1.0
  max_update:
    type: "constant"
    warmup_steps: 0
    min_factor: 1.0
