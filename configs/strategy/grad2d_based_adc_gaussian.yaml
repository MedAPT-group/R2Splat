enabled: true
type: grad2d_based_adc

absgrad: true
scale_grad_by_image: true

refine_start_iter: 500
refine_stop_iter: 15000
refine_every: 100

prune_opa_abs: 1.0e-5

# Match r2_gaussian's densify_grad_threshold for the signed-gradient path.
grow_grad2d: 5.0e-4
grow_scale3d: 0.10

min_remaining: 100
max_gaussians: 500000

split_scales_div: 1.6
uncertainty_grad_weight: 0.0
uncertainty_grad_mode: std
uncertainty_grad_scale: 1.0
uncertainty_grad_max_multiplier: 0.0
split_sampling: random
split_long_axis_offset: 0.5
new_uncertainty_mode: inherit
