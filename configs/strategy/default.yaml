enabled: true
type: grad2d_based_adc

# CUDA absgrad for densification statistics.
absgrad: true

refine_start_iter: 500
refine_stop_iter: 30000
refine_every: 200

# Prune Gaussians whose |opacity| is below this threshold.
prune_opa_abs: 1.0e-6

# Grow criterion based on 2D mean gradient magnitude (either v_means2d_abs or |v_means2d|).
grow_grad2d: 5.0e-4

# Scale threshold for split-vs-duplicate, expressed as a RATIO of world scale.
# Runtime conversion (when bbox is available):
#   abs_threshold = grow_scale3d * max(bbox_extent_xyz)
# where bbox_extent_xyz = bbox_max - bbox_min.
# Then:
#   scale_3d = max(activated_scales)
#   scale_3d > abs_threshold  -> split
#   scale_3d <= abs_threshold -> duplicate
grow_scale3d: 0.09

# Limits
min_remaining: 100
max_gaussians: 200000

# Split behavior:
# child_scale = parent_scale / split_scales_div
# Use 1.6 to match r2_gaussian default split shrink factor.
split_scales_div: 1.6
