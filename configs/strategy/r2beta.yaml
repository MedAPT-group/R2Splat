# Conservative split strategy tuned for Beta primitives.
# Use a larger scale threshold before splitting to be more conservative.
enabled: true
type: grad2d_based_adc

# Use CPU densification by default (same as r2gaussian profile)
absgrad: true

# Keep CUDA->Python gradient scaling consistent across primitives
scale_grad_by_image: true

# Densification schedule
refine_start_iter: 500
refine_stop_iter: 15000
refine_every: 100

# Prune opacity threshold (leave similar to r2gaussian)
prune_opa_abs: 1.0e-5

# Grow (split) criteria.  Beta activated scale represents compact support and
# is configured around 3x Gaussian sigma, so use a 3x split threshold.
grow_grad2d: 5.0e-4
grow_scale3d: 0.30

# Limits
min_remaining: 100
max_gaussians: 500000

# Split behavior: child_scale = parent_scale / split_scales_div
split_scales_div: 1.6

# Notes: raising `grow_scale3d` makes the algorithm require a larger
# projected/world scale before allowing a split (more conservative).
