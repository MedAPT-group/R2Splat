# Gaussian primitive training configuration.
defaults:
  - base
  - model: gaussian
  - init: default
  - trainer: default
  - optim: gaussian
  - schedule: default
  - strategy: grad2d_based_adc_gaussian
  - vis: "off"
  - _self_
  - optional exp: null

# Fill these from the command line, or select an experiment with:
#   exp=0_chest_cone_25_views
exp:
  data_dir: ???
  result_dir: ???

# r2_gaussian compatibility defaults for synthetic datasets.
# Override with init.source=online when no init_<scene>.npy file exists.
init:
  source: file

random:
  seed: 0
