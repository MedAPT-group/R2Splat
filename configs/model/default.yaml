# Gaussian model initialization parameters.
#
# scale_min_relative / scale_max_relative follow R2Gaussian: they are relative
# fractions of max(scanner.sVoxel). Training/validation scripts multiply them
# into world-space bounds before calling GaussianParams and CUDA operators.

global_scale: 1.0
init_opa_scale: 1.0
init_scale_multiplier: 1.0

# Primitive family: gaussian or beta.
primitive_type: gaussian

# Beta primitive shape activation:
# gamma = beta_gamma_init * exp(raw_beta).
# raw_beta=0 gives gamma=3.5 and projected exponent gamma+0.5=4.
beta_gamma_init: 3.5

scale_min_relative: 0.0005
scale_max_relative: 0.5
