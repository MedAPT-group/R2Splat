# Beta primitive model. Use with `model=beta`.

global_scale: 1.0
init_opa_scale: 1.0
# Beta support is compact.  A scale about 3x the Gaussian scale makes its
# support comparable to the Gaussian radius_clip=3 footprint.
init_scale_multiplier: 3.0

primitive_type: beta
beta_gamma_init: 3.5

# Relative fractions of max(scanner.sVoxel), matching R2Gaussian.
scale_min_relative: 0.0005
scale_max_relative: 0.5
