# Top-level config for chest_cone 25-views using Beta primitives.
defaults:
  - base
  - model: beta
  - trainer: r2gaussian
  - optim: beta_adam
  - schedule: r2gaussian_exp
  - exp: 25_views
  - init: r2gaussian
  - strategy: r2beta
  - vis: r2gaussian
  - _self_

trainer:
  eps_blur: 1.0e-6
  eps3d: 1.0e-6

exp:
  result_dir: "output/0_chest_cone_25_views_beta"
