enabled: true

# Trigger steps for compensation sampling.
steps: [2950, 5950, 8950, 11950]

diff_threshold: 0.05
candidate_ratio: 0.002 # we hope one gaussian can fit 8*8*8 = 512 voxels, so we set candidate_ratio to 1/512 ~ 0.002
max_new_ratio: 0.05 # we can add at most 5% new gaussians at each compensation step
init_scale_multiplier: 0.5 # since unfitting and overfitting regions should be small after some steps, we set new gaussian initial scales smaller
opacity_scale: 1.0 # set initial opacity smaller to avoid too much turbulence

# Weighted sampling with p(i) proportional to exp(|diff_i| / T).
# T=0.1082 gives approx 4x probability for diff=0.20 vs diff=0.05.
sample_temperature: 0.1082
