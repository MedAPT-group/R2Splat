enabled: false

# Trigger steps for residual compensation.
steps: []

# Residual sampling threshold: select voxels with |coarse-current| >= threshold.
diff_threshold: 0.05

# n_add = min(num_candidates * candidate_ratio, num_gaussians * max_new_ratio)
candidate_ratio: 0.2
max_new_ratio: 0.1

# New Gaussian initial scale = global mean activated scale * init_scale_multiplier.
init_scale_multiplier: 0.5

# New Gaussian opacity = sampled_residual * opacity_scale.
opacity_scale: 0.3

# Weighted sampling with p(i) proportional to exp(|diff_i| / T).
# T=0.1082 gives approx 4x probability for diff=0.20 vs diff=0.05.
sample_temperature: 0.1082
