# One-stop profile for reduced-space Newton training on the simple cone
# Gaussian-initialized dataset.
#
# Usage:
#   python -m scripts.train --config-name reduced_newton_simple_gaussians_train

defaults:
  - base
  - model: playground_simple_shapes
  - trainer: r2gaussian
  - optim: reduced_newton
  - schedule: none
  - exp: playground_simple_shapes_cone
  - init: playground_file
  - compensate: none
  - strategy: r2gaussian
  - vis: playground_debug_every_step
  - _self_

exp:
  data_dir: "/home/chengzyi/myterminus/data/3DGS2CT/preprocessed/simple_dataset/cone_ntrain_5_angle_360/simple_geometries_cone"
  # "/home/chengzyi/myterminus/data/3DGS2CT/preprocessed/simple_dataset/cone_ntrain_5_angle_360/simple_stripes_cone"
  # /home/chengzyi/myterminus/data/3DGS2CT/preprocessed/simple_dataset/cone_ntrain_5_angle_360/simple_geometries_cone
  result_dir: "output/reduced_newton_chest"

model:
  init_opa_scale: 1.0
  init_scale_multiplier: 1.0

trainer:
  max_steps: 1000
  batch_size: 3
  angle_sampling_strategy: "evenly_spaced"
  save_steps: []
  eval_interval: 100
  lambda_tv: 0.05

schedule:
  enabled: false

compensate:
  enabled: false
  steps: []

strategy:
  enabled: true

vis:
  reduced_step_projection:
    enabled: true
    interval: 1
