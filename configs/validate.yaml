# Standalone validation configuration.

defaults:
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

data_dir: ""
checkpoint_path: ""
result_dir: null
device: "cuda:0"

eval_save_images_n: 100
ssim_window: 11
save_projection_npy: true
save_volume_npy: true

# Must match the relative training model config when loading a checkpoint.
# Validation multiplies these by max(scanner.sVoxel) before calling CUDA ops.
scale_min_relative: 0.0005
scale_max_relative: 0.5
eps_blur: 1.0e-8
eps3d: 1.0e-8
primitive_type: gaussian
beta_gamma_init: 3.5
