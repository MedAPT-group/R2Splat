# One-stop profile to mimic r2_gaussian settings.
#
# Usage:
#   python -m scripts.train --config-name r2gaussian
# or:
#   python -m scripts.train --config-name r2gaussian exp=25_views

defaults:
  - base
  - model: default
  - trainer: r2gaussian
  - optim: r2gaussian_adam
  - schedule: r2gaussian_exp
  - exp: 25_views
  - strategy: r2gaussian
  - vis: r2gaussian
  - _self_

