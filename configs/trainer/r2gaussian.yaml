# R2Gaussian-like training loop settings.
device: "cuda:0"

max_steps: 30001
batch_size: 1

# View sampling strategy for projection batches.
# Keep random as default to preserve existing first-order behavior.
angle_sampling_strategy: "random"

# Unit of meta_data angle values.
angle_unit: "auto"

save_steps: []

# Image loss settings: mean L1 + lambda_dssim * (1 - SSIM), matching R2Gaussian.
lambda_l1: 1.0
lambda_dssim: 0.25

# TV regularization: edge-mean anisotropic TV, directly aligned with R2Gaussian.
lambda_tv: 0.05
tv_vol_size: 32

# Operator parameters (keep project defaults)
eps_blur: 1.0e-8
img_tile_size: 16
vol_tile_size: 8
eps3d: 1.0e-8
# 3D voxelization support radius. Beta has compact support at radius 1.
radius_clip: 3.0
beta_radius_clip: 1.0
# 2D projection/rasterization tile radius. Gaussian uses 3 sigma; Beta uses
# its exact compact support radius to avoid rasterizing empty tiles.
img_radius_clip: 3.0
beta_img_radius_clip: 1.0

# Evaluation
eval_at_start: true
eval_interval: 1000
eval_at_end: false
ssim_window: 11
