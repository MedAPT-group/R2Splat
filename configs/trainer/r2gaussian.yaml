# R2Gaussian-like training loop settings.
device: "cuda:0"

max_steps: 30001
batch_size: 1

# View sampling strategy for projection batches.
# Keep random as default to preserve existing first-order behavior.
angle_sampling_strategy: "random"

# Unit of meta_data angle values.
angle_unit: "auto"

save_steps: []

# Image loss settings
# image_loss_type: r2gaussian-like l1
image_loss_type: "l1"
lambda_l1: 1.0
lambda_ssim: 0.25
window_size: 11

# TV regularization
lambda_tv: 0.05
tv_vol_size: 32

# Operator parameters (keep project defaults)
eps_blur: 1.0e-8
img_tile_size: 16
vol_tile_size: 8
eps3d: 1.0e-8
radius_clip: 3.0
vol_loss_eps: 1.0e-8

# Evaluation
eval_interval: 1000
