# Training loop configuration.

device: "cuda:0"

max_steps: 30001
batch_size: 1

# View sampling strategy for projection batches.
# random: original random cycling without replacement.
# evenly_spaced: sample each batch to cover angles as evenly as possible.
angle_sampling_strategy: "random"

# Unit of meta_data angle values.
# auto: infer radians/degrees from value range.
angle_unit: "auto"

# No intermediate checkpoints by default; train.py always saves ckpt_final.pt.
save_steps: []

# Image loss settings: mean L1 + lambda_dssim * (1 - SSIM).
lambda_l1: 1.0
lambda_dssim: 0.25

# TV regularization averaged over x/y/z edge counts.
lambda_tv: 0.05
tv_vol_size: 32

# Operator parameters
eps_blur: 1.0e-8
img_tile_size: 16
vol_tile_size: 8
eps3d: 1.0e-8
# 3D voxelization support radius. Beta has compact support at radius 1.
radius_clip: 3.0
beta_radius_clip: 1.0
# 2D projection/rasterization tile radius. Gaussian uses 3 sigma; Beta uses
# its exact compact support radius to avoid rasterizing empty tiles.
img_radius_clip: 3.0
beta_img_radius_clip: 1.0
# Backward kernel choice for training: "pixel" uses one thread per output
# pixel/voxel; "primitive" uses one warp per primitive-tile intersection.
backward_mode: "pixel"
# Optional per-domain overrides; inherit backward_mode when unset.
# img_backward_mode: "pixel"
# vol_backward_mode: "pixel"

# Evaluation
eval_at_start: true
eval_interval: 1000
eval_at_end: false
ssim_window: 11
