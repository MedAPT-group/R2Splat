# Training loop configuration.

device: "cuda:0"

max_steps: 30001
batch_size: 1

# View sampling strategy for projection batches.
# random: original random cycling without replacement.
# evenly_spaced: sample each batch to cover angles as evenly as possible.
angle_sampling_strategy: "random"

# Unit of meta_data angle values.
# auto: infer radians/degrees from value range.
angle_unit: "auto"

# No intermediate checkpoints by default; train.py always saves ckpt_final.pt.
save_steps: []

# Write one JSONL training-loss record every N steps. Set <=0 to disable.
loss_log_interval: 50

# Image loss settings: mean L1 + lambda_dssim * (1 - SSIM).
lambda_l1: 1.0
lambda_dssim: 0.25

# Primitive density uncertainty. Disabled by default for backward-compatible
# L1/DSSIM training; enable and set lambda_nll > 0 to train q_i with
# projection Laplace NLL.
uncertainty_enabled: false
lambda_nll: 0.0
lambda_uncertainty_prior: 0.0001
uncertainty_var_floor: 1.0e-6
uncertainty_var_max: 0.1
uncertainty_nll_auto_weight: true
uncertainty_nll_auto_min: 20.0
uncertainty_nll_auto_max: 1000.0
uncertainty_detach_contribution: true
# Multiplicative calibration factor applied to propagated uncertainty variance.
# A value of 1 preserves the raw primitive-propagated variance.
uncertainty_variance_scale: 1.0
# Shared detector/pixel variance added to the propagated projection variance
# before computing projection NLL. This is a hyperparameter, not trainable.
detector_uncertainty_var: 0.0

# Optional projection-view calibration. A small evenly-spaced subset of train
# views can be held out from reconstruction training and used only for
# uncertainty calibration.
# none: disabled.
# uncertainty: calibration NLL updates only raw_uncertainty.
# global_scale: calibration NLL updates only a global std scale tau, so
# propagated variance is multiplied by tau^2.
calibration_mode: "none"
calibration_num_views: 0
calibration_interval: 0
calibration_start_iter: 0
calibration_batch_size: 0
calibration_lr_uncertainty: 1.0e-4
calibration_lr_scale: 1.0e-2
calibration_scale_init: 1.0
calibration_scale_min: 0.05
calibration_scale_max: 20.0

# TV regularization averaged over x/y/z edge counts.
lambda_tv: 0.05
tv_vol_size: 32

# Operator parameters
eps_blur: 1.0e-8
img_tile_size: 16
vol_tile_size: 8
eps3d: 1.0e-8
# 3D voxelization support radius. Beta has compact support at radius 1.
radius_clip: 3.0
beta_radius_clip: 1.0
# 2D projection/rasterization tile radius. Gaussian uses 3 sigma; Beta uses
# its exact compact support radius to avoid rasterizing empty tiles.
img_radius_clip: 3.0
beta_img_radius_clip: 1.0
# Backward kernel choice for training: "pixel" uses one thread per output
# pixel/voxel; "primitive" uses one warp per primitive-tile intersection.
backward_mode: "primitive"
# Optional per-domain overrides; inherit backward_mode when unset.
# img_backward_mode: "pixel"
# vol_backward_mode: "pixel"

# Evaluation
eval_at_start: true
eval_interval: 1000
eval_at_end: false
ssim_window: 11
