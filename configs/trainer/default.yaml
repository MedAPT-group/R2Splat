# Training loop configuration.

device: "cuda:0"

max_steps: 30001
batch_size: 1

# View sampling strategy for projection batches.
# random: original random cycling without replacement.
# evenly_spaced: sample each batch to cover angles as evenly as possible.
angle_sampling_strategy: "random"

# Unit of meta_data angle values.
# auto: infer radians/degrees from value range.
angle_unit: "auto"

save_steps: [4999, 9999, 19999, 29999]

# Image loss settings
# image_loss_type: "l2" (default) or "l1"
image_loss_type: "l2"
lambda_l2: 1.0
lambda_ssim: 0.25
window_size: 11

# TV regularization.
# R2Gaussian uses lambda_tv=0.05 with TV averaged over x/y/z edge counts.
# Our CUDA TV term is voxel-count normalized, so the matched weight is 0.05 / 3.
lambda_tv: 0.0166666667
tv_vol_size: 32

# Operator parameters
eps_blur: 1.0e-8
img_tile_size: 16
vol_tile_size: 8
eps3d: 1.0e-8
radius_clip: 3.0
vol_loss_eps: 1.0e-4

# Evaluation
eval_interval: 1000
