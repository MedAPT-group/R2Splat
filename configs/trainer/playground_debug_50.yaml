# 50-step debug trainer profile with evaluation every step.

device: "cuda:0"

max_steps: 50
batch_size: 3
angle_sampling_strategy: "evenly_spaced"
angle_unit: "auto"

save_steps: []

image_loss_type: "l2"
lambda_l2: 1.0
lambda_ssim: 0.25
window_size: 11

lambda_tv: 0.05
tv_vol_size: 32

eps_blur: 1.0e-8
img_tile_size: 16
vol_tile_size: 8
eps3d: 1.0e-8
radius_clip: 3.0
vol_loss_eps: 1.0e-8

eval_interval: 10