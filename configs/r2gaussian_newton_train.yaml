# One-stop profile for r2gaussian-style training with diagonal-clamped Newton.
#
# Usage:
#   python -m scripts.train --config-name r2gaussian_newton_train
# or:
#   python -m scripts.train --config-name r2gaussian_newton_train exp=25_views

defaults:
  - base
  - model: default
  - trainer: r2gaussian
  - optim: default
  - schedule: r2gaussian_exp
  - exp: 25_views
  - init: r2gaussian
  - compensate: none
  - strategy: r2gaussian
  - vis: r2gaussian
  - _self_

trainer:
  # Keep parity with r2gaussian_train profile.
  save_steps: []
  max_steps: 5000
  batch_size: 3
  angle_sampling_strategy: "evenly_spaced"
  eval_interval: 500

strategy:
  refine_start_iter: 200
  refine_stop_iter: 2500

optim:
  use_second_order: true
  second_order_optimizer: "newton_diag_clamp"

  # Use raw grad/hess signals directly in diagonal-clamped Newton.
  grad_strategy: "RAW"
  hess_strategy: "RAW"
  hess_mode: "DIAGONAL"

  # Start from r2gaussian first-order LRs and scale by 1e-5 to offset
  # the 1/(damping + clamp) amplification when Hessian is clamped.
  lr_means: 0.0002
  lr_quats: 0.001
  lr_scale_ori: 0.005
  lr_opacity: 0.0005

  # Per-parameter damping: 1e-5 -> 1e-6 via schedule.damping.min_factor=0.1.
  damping_means: 1.0e-7
  damping_quats: 1.0e-7
  damping_scale_ori: 1.0e-7
  damping_opacity: 1.0e-7

  # Clamp all Hessian diagonal entries to at least 1e-6.
  clamp_means: 1.0e-7
  clamp_quats: 1.0e-7
  clamp_scale_ori: 1.0e-7
  clamp_opacity: 1.0e-7

  # Element-wise update clip for safety during early Newton iterations.
  max_update_means: 0.1
  max_update_quats: 0.1
  max_update_scale_ori: 1.0
  max_update_opacity: 0.1

  allow_negative_opacity: false

schedule:
  enabled: true

  # Keep r2gaussian-style exponential LR decay.
  lr:
    type: "exp"
    warmup_steps: 0
    min_factor: 0.1

  # Exponential damping decay: 1e-5 -> 1e-6.
  damping:
    type: "exp"
    warmup_steps: 0
    min_factor: 0.1

vis:
  save_projection_comparison: true
  save_volume_comparison: true
  save_loss_curve: true
  video:
    enabled: false
    interval: 500
