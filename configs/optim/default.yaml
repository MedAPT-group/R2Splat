# Adam optimizer configuration.

lr_means: 0.0002
lr_quats: 0.001
lr_scale_ori: 0.005
# Raw opacity has no activation, so this is lower than the R2Gaussian density LR.
lr_opacity: 0.0001

beta1: 0.9
beta2: 0.999
eps: 1.0e-8

# Compensation can inject signed kernels; keep false for standard positive density.
allow_negative_opacity: false
