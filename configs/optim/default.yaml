# Optimizer configuration.
#
# When use_second_order is false, only lr_* fields are used (Adam).
# When true, damping_* fields are also used (Newton family).

use_second_order: false

# Per-parameter learning rates
lr_means: 0.0002 # r2-gaussian like
lr_quats: 0.001 # r2-gaussian like
lr_scale_ori: 0.005 # r2-gaussian like
lr_opacity: 0.0001 # r2-gaussian like
# r2-gaussian uses softplus activated opacities whereas we use no-activation
# after training, r2-gaussian opacities mainly lie in [5e-3, 5e-2], where the gradient approximately lie in [5e-3, 5e-2]
# for no-activation opacities, the gradient is 1.0
# therefore, we use 1e-2 times the r2-gaussian learning rate: 1e-2 * 1e-2 = 1e-4

# Adam hyper-parameters (first-order only)
beta1: 0.9 # pytorch adam default
beta2: 0.999 # pytorch adam default
eps: 1.0e-8 # pytorch adam default

# Newton hyper-parameters (second-order only)
hess_mode: "DIAGONAL"
grad_strategy: "RAW"
hess_strategy: "RAW"
damping_means: 1.0e-3
damping_quats: 1.0e-3
damping_scale_ori: 1.0e-3
damping_opacity: 1.0e-3
