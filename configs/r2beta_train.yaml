# One-stop profile for sweep-tuned Beta primitive training.
#
# Usage:
#   python -m scripts.train --config-name r2beta_train
# or:
#   python -m scripts.train --config-name r2beta_train exp.data_dir=/path/to/sample

defaults:
  - base
  - model: beta
  - trainer: r2gaussian
  - optim: beta_adam
  - schedule: r2gaussian_exp
  - exp: 25_views
  - init: r2gaussian
  - strategy: r2beta
  - vis: r2gaussian
  - _self_

trainer:
  save_steps: []
  eval_at_start: false
  eval_interval: 0
  eval_at_end: true
  eps_blur: 1.0e-6
  eps3d: 1.0e-6

vis:
  save_projection_comparison: false
  save_volume_comparison: false

exp:
  result_dir: "output/r2beta_train"
