# Visualization profile for step-by-step debug.

save_projection_comparison: true
save_volume_comparison: true
save_loss_curve: true

video:
  enabled: false
  interval: 1
  view_index: 0
  fps: 10
  value_min: 0.0
  value_max: 1.0
  frame_subdir: "video_frames"
  output_name: "projection_progress.mp4"

gaussian_state_video:
  enabled: false
  interval: 1
  fps: 10
  frame_subdir: "gaussian_state_frames"
  output_name: "gaussian_state_progress.mp4"

  max_points: 3000
  point_size_min: 8.0
  point_size_max: 120.0
  use_log_scale_size: true

  axis_length_factor: 0.25
  axis_length_min_ratio: 0.002
  axis_length_max_ratio: 0.05
  axis_alpha: 0.45
  axis_linewidth: 0.6

  elev: 20.0
  azim: 35.0
  colormap: "viridis"
  opacity_activation: "raw"
  opacity_vmin: null
  opacity_vmax: null