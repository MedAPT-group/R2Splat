# Visualization configuration branch (all disabled by default).

# Existing image visualizations saved at eval time.
save_projection_comparison: false
save_volume_comparison: false
save_loss_curve: false

# Fixed-view training video visualization.
video:
  enabled: false
  interval: 5
  view_index: 0
  fps: 10
  value_min: 0.0
  value_max: 1.0
  frame_subdir: "video_frames"
  output_name: "projection_progress.mp4"

# 3-D Gaussian state video (means/scales/rotations/opacities).
# Axes are fixed to bbox (or [-1,1] fallback) for temporal consistency.
gaussian_state_video:
  enabled: false
  interval: 5
  fps: 10
  frame_subdir: "gaussian_state_frames"
  output_name: "gaussian_state_progress.mp4"

  max_points: 3000
  point_size_min: 8.0
  point_size_max: 120.0
  use_log_scale_size: true

  axis_length_factor: 0.25
  axis_length_min_ratio: 0.002
  axis_length_max_ratio: 0.05
  axis_alpha: 0.45
  axis_linewidth: 0.6

  elev: 20.0
  azim: 35.0
  colormap: "viridis"
  opacity_activation: "raw"
  opacity_vmin: null
  opacity_vmax: null

# Reduced Newton per-parameter-group projection debug visualization.
# When enabled, each parameter-group update is saved as a 2x5 figure:
# before / after / GT / after-before / error improvement.
reduced_step_projection:
  enabled: false
  interval: 1
  frame_subdir: "reduced_step_projection"
  perpendicular_angle_offset_deg: 90.0
  max_image_size: 256
  ray_samples: 128
  use_volume_gt: true
  auto_value_range: true
  value_min: 0.0
  value_max: 1.0
  value_percentile: 99.5
  diff_percentile: 99.0
  improvement_percentile: 99.0
  gamma: 0.6
  value_cmap: "magma"
  diff_cmap: "coolwarm"
  improvement_cmap: "RdYlGn"
