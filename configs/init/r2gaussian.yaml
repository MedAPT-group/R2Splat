# Gaussian initialization module configuration.
# source:
#   online: reconstruct coarse volume from train projections and sample points.
#   file:   load existing init_<scene>.npy from disk.
source: online

# Coarse reconstruction method for online initialization.
# Supported: sart, fdk, random
recon_method: fdk

# Number of sampled Gaussian points.
n_points: 50000

# Sampling parameters (same defaults as initialize_pcd).
density_thresh: 0.05
density_rescale: 0.15
random_density_max: 1.0

# TIGRE SART iterations used when recon_method=sart.
# sart_n_iter: 20
